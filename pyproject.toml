[project]
name = "lifelog-ai"
version = "0.1.0"
description = "Telegram life-log bot: Claude turns free-form messages into typed events, modeled with dbt on BigQuery"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "anthropic>=2.6",
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    "pydantic>=2.14.3",
    "python-telegram-bot[job-queue]>=21.6",
    "pyyaml>=6.0.3",
]

[project.scripts]
lifelog = "lifelog.cli:main"

[project.optional-dependencies]
voice = [
    "av>=15,<19",
    "faster-whisper>=1.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lifelog"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# prompts read better unwrapped
"src/lifelog/extract/claude.py" = ["E501"]
"src/lifelog/bot/flows.py" = ["E501"]
"src/lifelog/bot/app.py" = ["E501"]
"src/lifelog/evals.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
