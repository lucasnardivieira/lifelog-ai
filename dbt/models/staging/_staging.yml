version: 2

models:
  - name: stg_events
    description: Typed events with local date and life area.
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: event_date
        data_tests: [not_null]
      - name: event_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [sleep, exercise, energy, meal, affect, mood, stress, needs, assessment,
                         gratitude, journal, study, reading, work, habit, expense, income, social]
      - name: area
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [body, mind, growth, money_social]
      - name: score
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
      - name: valence
        data_tests:
          - accepted_values:
              arguments:
                values: [-2, -1, 0, 1, 2]
      - name: instrument
        data_tests:
          - accepted_values:
              arguments:
                values: [who5, pss10, life_satisfaction]
