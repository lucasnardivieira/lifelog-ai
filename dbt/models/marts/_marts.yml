version: 2

models:
  - name: fct_daily
    description: >
      One row per calendar day (no gaps) with all metrics and four 0–100 life scores.
      Scores are transparent heuristics (sleep vs goal, quality, energy, exercise; mood, stress,
      reflection; study and reading vs goals; social time and discretionary spend vs budget),
      tunable via vars in dbt_project.yml.
    columns:
      - name: day
        data_tests: [unique, not_null]
      - name: body_score
        data_tests: [not_null]
      - name: mind_score
        data_tests: [not_null]
      - name: growth_score
        data_tests: [not_null]
      - name: money_social_score
        data_tests: [not_null]
  - name: fct_weekly
    columns:
      - name: week_start
        data_tests: [unique, not_null]
  - name: fct_spending
    description: Spend per day and category.
  - name: fct_study
    description: Study minutes per day and topic.
  - name: fct_events
    columns:
      - name: event_id
        data_tests: [unique, not_null]
  - name: fct_affect
    description: Affect check-ins on Russell's circumplex.
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: quadrant
        data_tests:
          - accepted_values:
              arguments:
                values: [yellow, red, blue, green]
  - name: fct_emotions
    description: Weekly emotion-word usage (emotional granularity).
    columns:
      - name: quadrant
        data_tests: [not_null]
  - name: fct_assessments
    description: WHO-5, PSS-10 and life satisfaction, scored. Flags are not diagnoses.
    columns:
      - name: score
        data_tests: [not_null]
  - name: fct_habits
    description: Daily habit check-ins with their if-then plans.
